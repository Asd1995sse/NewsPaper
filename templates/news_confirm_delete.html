{% extends 'default.html' %}

{% block title %}Удаление новости{% endblock %}

{% block content %}
    <h1>Удаление новости</h1>
    
    <p>Вы уверены, что хотите удалить новость <strong>"{{ post.title }}"</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Да, удалить">
    </form>
    
    <p><a href="{% url 'news:list' %}">← Отмена</a></p>
{% endblock %}
